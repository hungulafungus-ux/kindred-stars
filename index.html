    <h1 class="sr-only">Kindred Stars</h1>
    <canvas id="sky" aria-label="Night sky of word stars"></canvas>
    <div id="safe-probe" aria-hidden="true"></div>
    <header class="hud" id="hud">
      <div class="hud-row">
        <span class="hud-level" id="hud-level">Level 1</span>
        <span class="hud-found" id="hud-found">families found 0/0</span>
        <button class="hud-pause" id="hud-pause" type="button" aria-label="Pause"><span></span></button>
      </div>
      <div class="hud-row">
        <div class="hud-sparks" id="hud-sparks" role="img" aria-label="sparks"></div>
      </div>
      <div class="hud-revealed" id="hud-revealed" aria-live="polite"></div>
    </header>
    <div class="praise" id="praise" aria-live="polite"></div>
    <nav class="helpers" id="helpers" aria-label="Helpers">
      <button type="button" data-helper="telescope">Telescope <span class="count">0</span></button>
      <button type="button" data-helper="comet">Comet <span class="count">0</span></button>
      <button type="button" data-helper="kindling">Kindling <span class="count">0</span></button>
    </nav>
    <section class="screen" id="screen-win" hidden>
      <h2>The sky is complete</h2>
      <p id="win-sparks"></p>
      <p id="win-earned"></p>
      <button type="button" id="win-next">Next level</button>
    </section>
    <section class="screen" id="screen-lost" hidden>
      <h2>Out of sparks</h2>
      <p>No penalty. This sky will wait for you.</p>
      <button type="button" id="lost-retry">Try again</button>
    </section>
    <section class="screen" id="screen-pause" hidden>
      <h2>Paused</h2>
      <button type="button" id="pause-resume">Resume</button>
      <button type="button" class="quiet" id="pause-restart">Start this sky again</button>
      <button type="button" class="quiet" id="pause-sound">Sound: on</button>
    </section>
    <div class="turn-upright">Turn your phone upright to play.</div>
    <p id="boot-error" hidden>The night sky could not start.</p>
    <script>
      // Offline worker. A waiting update is adopted only when this page opens and
      // no level is on screen. The worker itself never reloads the page.
      (function () {
        if (!("serviceWorker" in navigator)) return;

        var reloading = false;

        function levelActive() {
          try {
            return sessionStorage.getItem("ks-level-active") === "1";
          } catch (error) {
            return false;
          }
        }

        function reloadOnce() {
          if (reloading || levelActive()) return;
          try {
            if (sessionStorage.getItem("ks-sw-reloaded") === "1") return;
            sessionStorage.setItem("ks-sw-reloaded", "1");
          } catch (error) {
            return;
          }
          reloading = true;
          window.location.reload();
        }

        // Vite injects this script only on the dev server. public/sw.js is the
        // unversioned "dev" worker there, and registering it caches source modules.
        function viteDevServer() {
          if (typeof document === "undefined" || !document.getElementsByTagName) return false;
          var scripts = document.getElementsByTagName("script");
          for (var i = 0; i < scripts.length; i++) {
            var src = scripts[i].getAttribute("src") || "";
            if (src.indexOf("/@vite/client") !== -1) return true;
          }
          return false;
        }

        function leaveDevServer() {
          var pending;
          try {
            pending = navigator.serviceWorker.getRegistrations();
          } catch (error) {
            return;
          }
          if (!pending || !pending.then) return;
          var controlled = !!navigator.serviceWorker.controller;
          pending.then(function (registrations) {
            var dropping = [];
            for (var i = 0; i < registrations.length; i++) dropping.push(registrations[i].unregister());
            Promise.all(dropping).then(function () {
              if (!controlled && registrations.length === 0) return;
              try {
                if (sessionStorage.getItem("ks-sw-dev-cleared") === "1") return;
                sessionStorage.setItem("ks-sw-dev-cleared", "1");
              } catch (error) {
                return;
              }
              window.location.reload();
            });
          });
        }

        window.addEventListener("load", function () {
          if (viteDevServer()) {
            leaveDevServer();
            return;
          }

          if (navigator.serviceWorker.controller) {
            try {
              sessionStorage.removeItem("ks-sw-reloaded");
            } catch (error) {
              // Session storage can be blocked. The worker still registers.
            }
          }

          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .then(function (registration) {
              var pending = registration.waiting;
              if (pending && navigator.serviceWorker.controller && !levelActive()) {
                navigator.serviceWorker.addEventListener("controllerchange", function () {
                  reloadOnce();
                });
                pending.postMessage({ type: "SKIP_WAITING" });
                return;
              }

              function watch(worker) {
                if (!worker) return;
                if (worker.state === "activated") reloadOnce();
                worker.addEventListener("statechange", function () {
                  if (worker.state === "activated") reloadOnce();
                });
              }

              if (!navigator.serviceWorker.controller) {
                watch(registration.installing);
                watch(registration.waiting);
                if (registration.active) reloadOnce();
              }
            })
            .catch(function (error) {
              console.warn("Kindred Stars service worker was not registered.", error);
            });
        });
